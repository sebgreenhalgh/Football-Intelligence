name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gold-and-reviewer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check lock
        run: uv lock --check
      - name: Install bounded CPU test dependencies
        run: uv sync --only-group reviewer --only-group dev --no-install-project
      - name: Data and metadata boundaries
        run: |
          uv run --no-sync python scripts/check_repository_data_boundaries.py
          uv run --no-sync python scripts/check_project_metadata.py
      - name: New Gold code lint and format
        run: |
          uv run --no-sync ruff check src/football_intelligence/gold tests/test_gold_corpus.py scripts/check_project_metadata.py
          uv run --no-sync ruff format --check src/football_intelligence/gold tests/test_gold_corpus.py scripts/check_project_metadata.py
      - name: Synthetic Gold and dense reviewer contracts
        run: >-
          uv run --no-sync pytest -q
          tests/test_gold_corpus.py
          tests/test_g7f_a_gold_corpus_and_eval.py
          tests/test_g7f_a_r1_frame_registry_and_adapter.py
          tests/test_g7f_c_dense_person_gold.py
          tests/test_g7f_c_calibration_adjudication.py
          tests/test_g7f_d_interim_dense_gold_audit.py
      - name: Gold CLI
        run: uv run --no-sync python -m football_intelligence.gold --help

# No protected source media, human decisions, GPU inference or sealed identities in CI.
