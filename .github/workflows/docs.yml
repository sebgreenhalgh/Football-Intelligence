name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'README.md', 'AGENTS.md', 'PROJECT_STATUS.json', 'configs/detectors/**', 'scripts/check_project_metadata.py']
  pull_request:

permissions:
  contents: read

jobs:
  canonical-links-and-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_project_metadata.py
