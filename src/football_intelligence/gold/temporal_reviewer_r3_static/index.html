<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporal Gold · R3</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header><div><strong>Temporal Gold</strong><span id="match"></span><span class="badge">Candidate blind</span></div><div id="progress"></div><small>R3 · Internal human review</small></header>
<main>
 <section class="imageArea">
  <div class="toolbar"><strong id="frameLabel">Loading…</strong><span id="modeBadge">Pan / Edit</span><div class="spacer"></div><button id="fit">FIT</button><button id="reset">RESET VIEW</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">+</button><span id="zoomLabel"></span></div>
  <div id="viewport" tabindex="0" aria-label="Annotation image. Ctrl-wheel to zoom, scroll or Space-drag to pan"><canvas id="canvas"></canvas><div id="selectionLabel"></div></div>
  <nav class="navigation"><button id="prevFrame">← PREVIOUS FRAME</button><div id="timeline" aria-label="Frame strip"></div><button id="nextFrame">NEXT FRAME →</button></nav>
  <div class="hint">Pinch / Ctrl + wheel to zoom · Scroll to pan · Space + drag to pan · Esc to cancel drawing</div>
 </section>
 <aside><nav id="phases" aria-label="Review phases"></nav><div id="steps"></div><div id="task" aria-live="polite"></div></aside>
</main>
<footer><span id="status" role="status">Loading authorized sequence…</span><span id="lifecycle">LOADING_FRAME</span><button id="saveDraft">SAVE DRAFT</button></footer>
<script src="/view.js"></script><script src="/app.js"></script>
</body></html>
