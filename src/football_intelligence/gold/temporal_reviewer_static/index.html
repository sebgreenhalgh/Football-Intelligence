<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporal Gold reviewer</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header><strong>Temporal Gold</strong><span id="modeBadge">PAN_EDIT</span><span id="lifecycle">IDLE</span><span id="status" role="status">Loading</span></header>
<nav aria-label="Sequence navigation"><label>Sequence <select id="sequence"></select></label><span id="match"></span><button id="prevFrame">Previous frame</button><span id="frameLabel">1/9</span><button id="nextFrame">Next frame</button><span id="completion"></span></nav>
<div class="layout"><main>
<section class="context"><h2>Visual context (not Gold truth)</h2><video id="context" controls preload="none"></video></section>
<section class="timeline" id="timeline" aria-label="Nine annotation frames"></section>
<div class="toolbar" aria-label="Detection interaction modes"><button data-mode="PAN_EDIT">Pan / edit</button><button data-mode="DRAW_PERSON">Draw person</button><button data-mode="ADD_VISIBLE_COMPONENT">Add visible component</button><button data-mode="DRAW_IGNORE_REGION">Draw ignore region</button><button id="finishPolygon">Finish polygon</button><button id="cancelPolygon">Cancel polygon</button><button id="zoomIn">Zoom +</button><button id="zoomOut">Zoom -</button><button id="deleteSelected">Remove selected draft shape</button></div>
<div id="viewport"><canvas id="canvas" aria-label="Source-coordinate annotation frame"></canvas></div>
<p id="detectionBadge">DETECTION</p>
</main><aside>
<section><h2>DETECTION</h2><label>Relevance <select id="relevance"><option>MATCH_RELEVANT</option><option>NON_MATCH_RELEVANT</option><option>RELEVANCE_UNCERTAIN</option></select></label><label>Ignore reason <select id="ignoreReason"><option>DENSE_CROWD_UNRESOLVABLE</option><option>BENCH_CLUSTER_UNRESOLVABLE</option><option>TINY_AMBIGUOUS_PERSON_CLUSTER</option><option>SEVERE_VISUAL_ARTIFACT</option><option>OTHER_NON_EVALUABLE_REGION</option></select></label><div id="people"></div><div id="strips"></div><label><input id="detectionAssertion" type="checkbox"> I have reviewed the full image and annotated every individually evaluable visible human.</label><button id="finalizeDetection">Finalize DETECTION frame</button></section>
<section><h2>TRACKLET</h2><div class="toolbar"><button id="createTracklet">Create tracklet</button><button id="addMember">Add selected person</button><button id="removeMember">Remove selected member</button><button id="endTracklet">End tracklet</button><button id="possibleContinuity">Mark possible continuity</button></div><label>Active tracklet <select id="activeTracklet"></select></label><label>Possible successor <select id="successorTracklet"></select></label><div id="trackletHistory"></div><label><input id="trackletAssertion" type="checkbox"> I reviewed every MATCH_RELEVANT visible person across this sequence and linked only continuity I can support from the images.</label><button id="finalizeTracklet">Finalize TRACKLET</button></section>
<section><h2>BALL</h2><div class="toolbar"><button data-ball="VISIBLE">VISIBLE + click</button><button data-ball="OCCLUDED">OCCLUDED</button><button data-ball="OFF_SCREEN">OFF_SCREEN</button><button data-ball="UNCERTAIN">UNCERTAIN</button></div><span id="ballStatus"></span><label><input id="ballAssertion" type="checkbox"> I reviewed the ball visibility/location state in every annotation frame and did not infer hidden positions.</label><button id="finalizeBall">Finalize BALL</button></section>
<section><h2>MATCH_STATE</h2><div id="stateButtons" class="toolbar"></div><label>Apply current state from frame <input id="intervalStart" type="number" min="1" max="9" value="1"></label><label>through frame <input id="intervalEnd" type="number" min="1" max="9" value="9"></label><button id="applyInterval">Apply interval</button><span id="matchStateStatus"></span><label><input id="stateAssertion" type="checkbox"> I reviewed the football match state for every annotation frame using the available visual context.</label><button id="finalizeState">Finalize MATCH_STATE</button></section>
<section><h2>Sequence</h2><label><input id="sequenceAssertion" type="checkbox"> All required Gold layers for this sequence have been reviewed and finalized.</label><button id="finalizeSequence">Finalize sequence</button></section>
</aside></div><script src="/app.js"></script></body></html>
